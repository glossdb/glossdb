[package]
name = "glossql-apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
glossql-duck = { path = "../duck", optional = true }
glossql-glossary = { path = "../glossary" }
glossql-session = { path = "../session" }
datafusion = { workspace = true }
arrow-ipc = { workspace = true }
arrow-json = { workspace = true }
axum = { workspace = true }
futures.workspace = true
serde.workspace = true
serde_json = { workspace = true }
tera.workspace = true
tokio = { workspace = true }
toml.workspace = true
tracing.workspace = true

[features]
# The engine on DuckDB in place of the session: the doors switch by
# one `use`; the DataFusion engine stays the default until the cut-over.
duck = ["dep:glossql-duck"]

[dev-dependencies]
glossql-catalog = { path = "../catalog" }
glossql-parser = { path = "../parser" }
glossql-scripts = { path = "../scripts" }
tower.workspace = true
tempfile.workspace = true

[lints]
workspace = true
