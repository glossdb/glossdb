title = "Console"
# no dataset line, ever: the URL binds it (/<dataset>/app/console), so one
# app serves every dataset and the bar's picker switches between them.
# The bar shows the overview, the five functions of data intelligence
# (integration, metadata, quality, governance, lineage) and the data.
# Every page names the section it belongs to, and the left nav lists
# what is inside the current one. A page with `bar = false` is reached
# from the left nav. The bar draws a hairline before the data section.
pages = [
  { name = "index", title = "Overview", section = "Overview", group = "catalog" },
  { name = "history", title = "History", section = "Overview", bar = false },
  { name = "views", title = "Integration", section = "Integration", group = "catalog" },
  { name = "glossary", title = "Metadata", section = "Metadata", group = "catalog" },
  { name = "model", title = "Model", section = "Metadata", bar = false },
  { name = "quality", title = "Quality", section = "Quality", group = "catalog" },
  { name = "review", title = "Governance", section = "Governance", group = "catalog" },
  { name = "lineage", title = "Lineage", section = "Lineage", group = "catalog" },
  { name = "export", title = "Data", section = "Data", group = "data" },
  { name = "query", title = "Query", section = "Data", bar = false },
]
