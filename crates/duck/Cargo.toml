[package]
name = "glossdb-duck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "The engine on DuckDB: the facade the interfaces use over the glossql extension and a DuckLake"

[dependencies]
# The two actor types the interfaces stamp a request with.
duckdb-neo = { workspace = true }
arrow = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
moka = { version = "0.12.16", features = ["sync"] }

# `testing`: the seams the suites stand on — the kits' sqllogictest
# runner and the golden workspace. The dev-dependencies of the three
# crates enable it; a release build does not compile them.
[features]
testing = []

[dev-dependencies]
glossdb-duck = { path = ".", features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
