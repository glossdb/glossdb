# The dependency rules the ci workflow holds (`cargo deny check`):
# advisories, licences, duplicates and sources. The lockstep rule —
# one arrow, one datafusion, one parquet in the tree — is a test in
# the serverd suite (tests/suite/conformance.rs), so `cargo test`
# holds it on a laptop too.

[graph]
# The two targets a build runs for: the image and the laptop.
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
yanked = "deny"
# An unmaintained advisory counts for a crate the workspace names and
# not for one the engine's crates pull in: those ride the engine's pins.
unmaintained = "workspace"
ignore = [
  # rsa under jsonwebtoken: the timing side channel is in private-key
  # operations, and this server only verifies with the issuer's public
  # keys — it holds no RSA private key.
  { id = "RUSTSEC-2023-0071", reason = "rsa rides jsonwebtoken; the server verifies with public keys and never signs" },
  # crypto-bigint 0.5 under jsonwebtoken's p256 and p384 0.13: timing
  # variability in operations meant to be constant-time. The server
  # verifies with the issuer's public keys and never signs. Closes when
  # jsonwebtoken moves to p256 0.14.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint rides jsonwebtoken's p256 0.13; the server verifies with public keys and never signs" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unlicense", "MIT-0",
  "0BSD", "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0", "bzip2-1.0.6",
]

[[licenses.clarify]]
crate = "ring"
expression = "Apache-2.0 AND ISC"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# A second version of a crate is a warning here; the arrow tree is the
# one that must not split, and the conformance test fails on it.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates reference each other by path.
allow-wildcard-paths = true
deny = [
  { crate = "openssl-sys", reason = "rustls everywhere; the distroless image has no libssl" },
  { crate = "native-tls", reason = "rustls everywhere" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
