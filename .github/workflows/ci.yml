# The standing invariant, checked by a machine on every push to main
# and every pull request: the format, clippy with warnings denied, the
# suite, the dependency rules (deny.toml) and the unused dependencies —
# on the target the image is built for, which the laptop is not. The
# suite runs on the gloss extension built from its repository at the
# commit crates/duck/gloss.ref names, kept in the actions cache by that
# commit so a pin move builds it once. Nothing here publishes:
# release.yml does, at a tag, from a commit this ran green on.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # rustup reads rust-toolchain.toml; the runner ships rustup.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ci
          cache-on-failure: true
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-machete
      - run: cargo fmt --all --check
      - run: cargo deny check
      - run: cargo machete
      - run: cargo clippy --workspace --all-targets --locked
      - name: The gloss extension, from the cache or its repository
        id: gloss
        run: echo "ref=$(cat crates/duck/gloss.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        id: gloss-cache
        with:
          path: gloss-out
          key: gloss-${{ steps.gloss.outputs.ref }}-linux_amd64
      - if: steps.gloss-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build
          git clone --filter=blob:none https://github.com/glossdb/gloss gloss-src
          cd gloss-src
          git checkout "${{ steps.gloss.outputs.ref }}"
          git submodule update --init --depth 1 duckdb extension-ci-tools
          GEN=ninja EXT_FLAGS=-DGLOSS_LAKE=OFF make release
          mkdir -p ../gloss-out
          cp build/release/repository/v2.0.0/*/gloss.duckdb_extension ../gloss-out/
          cp -r kits ../gloss-out/kits
          cp SPEC.md grammar.ebnf ../gloss-out/
          cd .. && rm -rf gloss-src
      - run: cargo nextest run --workspace --locked
        env:
          GLOSS_EXTENSION: ${{ github.workspace }}/gloss-out/gloss.duckdb_extension
          GLOSS_KITS: ${{ github.workspace }}/gloss-out/kits
