# The standing invariant, checked by a machine on every push to main
# and every pull request: the format, clippy with warnings denied, the
# suite, the dependency rules (deny.toml) and the unused dependencies —
# on the target the image is built for, which the laptop is not. The
# suite runs on the glossql extension at the commit crates/duck/glossql.ref
# names: from the actions cache, else the artifact the extension's own
# pipeline built for that commit, else built from its repository; the
# cache then holds it by the commit. Nothing here publishes:
# release.yml does, at a tag, from a commit this ran green on.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels the run before it; main's
# runs queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # rustup reads rust-toolchain.toml; the runner ships rustup.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ci
          cache-on-failure: true
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-machete
      # libduckdb-sys unpacks DuckDB's sources once under target/duckdb-sources/<hash>,
      # marked whole by a .complete file. A cached tree restored without its marker
      # makes the next unpack fail on the directory it finds, so such a tree goes.
      - name: Drop unmarked DuckDB source trees from the cache
        run: |
          for dir in target/duckdb-sources/*/; do
            [ -d "$dir" ] && [ ! -e "$dir.complete" ] && rm -rf "$dir"
          done
          true
      - run: cargo fmt --all --check
      - run: cargo deny check
      - run: cargo machete
      - run: cargo clippy --workspace --all-targets --locked
      - name: The glossql extension, from the cache, its pipeline's artifact or its repository
        id: gloss
        run: echo "ref=$(cat crates/duck/glossql.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: gloss-cache
        with:
          path: glossql-out
          key: extension-${{ steps.gloss.outputs.ref }}-linux_amd64
      # The script beside the pin: the kits and the two documents from the
      # pinned tree, the loadable from the artifact the extension's own
      # pipeline built for the commit, else built here.
      - if: steps.gloss-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh crates/duck/extension-at-pin.sh "${{ steps.gloss.outputs.ref }}" glossql-out
      - run: cargo nextest run --workspace --locked
        env:
          GLOSSQL_EXTENSION: ${{ github.workspace }}/glossql-out/glossql.duckdb_extension
          GLOSSQL_KITS: ${{ github.workspace }}/glossql-out/kits
