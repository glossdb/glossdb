# The standing invariant, checked by a machine on every push to main
# and every pull request: the format, clippy with warnings denied, the
# suite, the dependency rules (deny.toml) and the unused dependencies —
# on the target the image is built for, which the laptop is not. The
# suite runs on the glossql extension at the commit crates/duck/glossql.ref
# names: from the actions cache, else the artifact the extension's own
# pipeline built for that commit, else built from its repository; the
# cache then holds it by the commit. Nothing here publishes:
# release.yml does, at a tag, from a commit this ran green on.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels the run before it; main's
# runs queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # rustup reads rust-toolchain.toml; the runner ships rustup.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ci
          cache-on-failure: true
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-machete
      - run: cargo fmt --all --check
      - run: cargo deny check
      - run: cargo machete
      - run: cargo clippy --workspace --all-targets --locked
      - name: The glossql extension, from the cache, its pipeline's artifact or its repository
        id: gloss
        run: echo "ref=$(cat crates/duck/glossql.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: gloss-cache
        with:
          path: glossql-out
          key: extension-${{ steps.gloss.outputs.ref }}-linux_amd64
      # The kits and the language's two documents from the pinned tree; the
      # extension from the linux artifact its own pipeline uploads on every
      # run and keeps ninety days, looked up by the commit.
      - if: steps.gloss-cache.outputs.cache-hit != 'true'
        id: gloss-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="${{ steps.gloss.outputs.ref }}"
          git clone --filter=blob:none https://github.com/glossdb/glossql glossql-src
          git -C glossql-src checkout "$ref"
          mkdir -p glossql-out
          cp -r glossql-src/kits glossql-out/kits
          cp glossql-src/SPEC.md glossql-src/grammar.ebnf glossql-out/
          for run in $(gh api "repos/glossdb/glossql/actions/runs?head_sha=$ref&per_page=20" \
                         --jq '.workflow_runs[] | select(.name == "Main Extension Distribution Pipeline") | .id'); do
            name=$(gh api "repos/glossdb/glossql/actions/runs/$run/artifacts" \
                     --jq '.artifacts[] | select(.name | endswith("-extension-linux_amd64")) | .name' | head -1)
            [ -n "$name" ] || continue
            if gh run download "$run" -R glossdb/glossql -n "$name" -D glossql-artifact; then
              cp glossql-artifact/glossql.duckdb_extension glossql-out/
              rm -rf glossql-artifact
              echo "fetched=true" >> "$GITHUB_OUTPUT"
              echo "the extension at $ref from run $run, $name"
              break
            fi
          done
      # A pin without an artifact: built here, as the pipeline builds it.
      - if: steps.gloss-cache.outputs.cache-hit != 'true' && steps.gloss-artifact.outputs.fetched != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build
          cd glossql-src
          git submodule update --init --depth 1 duckdb extension-ci-tools
          GEN=ninja EXT_FLAGS=-DGLOSSQL_LAKE=OFF make release
          cp build/release/repository/v2.0.0/*/glossql.duckdb_extension ../glossql-out/
      - run: cargo nextest run --workspace --locked
        env:
          GLOSSQL_EXTENSION: ${{ github.workspace }}/glossql-out/glossql.duckdb_extension
          GLOSSQL_KITS: ${{ github.workspace }}/glossql-out/kits
