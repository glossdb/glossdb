[workspace]
resolver = "3"
members = ["crates/parser", "crates/glossary", "crates/apps", "crates/serverd", "crates/duck"]

[workspace.package]
version = "0.3.0"
edition = "2024"
# The minor rust-toolchain.toml pins; a crate built alone says so.
rust-version = "1.98"
# Nothing here is published to a registry: the artifacts are the image
# and the tarball (the glossql-release skill), and the crates reference
# each other by path.
publish = false
license = "Apache-2.0"
repository = "https://github.com/glossdb/glossql"

[workspace.lints.rust]
# macOS ld notes that datafusion-sized debug binaries outgrow the compact
# unwind table (__eh_frame > 16MB) — an exception-handling performance
# note, nothing actionable; every crate opts in via [lints] workspace.
linker_messages = "allow"

# What a memory bug looks like at compile time, so nobody has to find it
# with a stack overflow or a profiler. A future above 16 KB is boxed
# (the planner recursion has overflowed a 2 MB test thread before); a
# clone the borrow checker did not need is a copy. `unwrap_used` — a
# panic waiting for the row that has it — and the narrowing casts are
# `#![warn]`ed in each library and binary root instead: a lint here
# would reach the integration tests, where a panic is the assertion.
[workspace.lints.clippy]
large_futures = "warn"
redundant_clone = "warn"
# The size of a function, two ways (the thresholds: clippy.toml). A
# function above either carries `#[expect]` for the lint, so the list
# of them shrinks itself: an expect that no longer fires is an error.
too_many_lines = "warn"
cognitive_complexity = "warn"

# The released binary: symbols stripped (a quarter of the size back;
# the spans and events are the observability story, not backtrace names).
[profile.release]
strip = true

# Every test binary statically links datafusion + candle — one suite per
# crate (tests/suite/main.rs) plus the unit-test binaries; with default
# full debug info that was ~0.5GB per binary × every test target ×
# every stale hashed copy — a target/ in the hundreds of GB and an AV scan
# per link. Line tables keep workspace backtraces (file:line); dependencies
# carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.dependencies]
futures = "0.3"
# datafusion at the major its lockstep siblings release for: the
# planner, the parquet scan and sink, and the function libraries the
# engine ships by default (the crate's own default set, named here
# because `default-features = false` keeps the workspace choosing).
datafusion = { version = "55.1", default-features = false, features = ["parquet", "sql", "compression", "recursive_protection", "nested_expressions", "crypto_expressions", "datetime_expressions", "encoding_expressions", "regex_expressions", "string_expressions", "unicode_expressions"] }
datafusion-sql = "55.1"
datafusion-common = "55.1"
# `preserve_order`: a JSON object keeps its authored key order.
# datafusion-physical-plan 55 switches it on for every workspace build;
# named here so a single crate built alone orders the same way.
serde_json = { version = "1", features = ["preserve_order"] }
# arrow-ipc/arrow-json ride the arrow that datafusion 55 pins (59.2) — the
# same lockstep rule as above; bumping either alone splits the arrow tree.
arrow-ipc = "59.2"
arrow-json = "59.2"
# The engine on DuckDB (crates/duck): neo is the v2 C API crate; its
# libduckdb-sys downloads the prebuilt library of the DuckDB release it
# pins (DUCKDB_LIB_DIR points it at one instead). arrow's `ffi` feature
# reads the Arrow C stream DuckDB hands out, on the same arrow line.
duckdb-neo = "0.20000.1"
arrow = { version = "59.2", default-features = false, features = ["ffi"] }
axum = "0.8"
rmcp = { version = "3.1", features = ["transport-streamable-http-server", "elicitation"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "2"
insta = "1"
serde = { version = "1", features = ["derive"] }
# tera stays on its 1 line: the agents write the page snippets in its
# syntax, and the 2 line changes it (.github/dependabot.yml).
tera = { version = "1", default-features = false }
toml = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# The HTTP client the server makes its own calls with: the issuer's
# discovery document and key set, and the token it mints for the model
# service. rustls names the TLS backend — pure Rust, the same in a
# container as on a laptop.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# base64's default features add SIMD engines written in unsafe code;
# the strings here are cookie-sized, so the plain engine does.
base64 = { version = "0.23", default-features = false, features = ["std"] }
# Instrumentation. `tracing` is the facade every crate emits through —
# already in the tree via axum and rmcp; the subscriber is installed
# once, at the process edge (serverd).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# The OTLP export (crates/serverd/src/telemetry.rs): the same spans and
# events, sent to a collector when `OTEL_EXPORTER_OTLP_ENDPOINT` is set.
# opentelemetry-rust, traces only, protobuf over HTTP through the
# reqwest already in the tree; tracing-opentelemetry is the bridge from
# `tracing` spans to theirs and pins the opentelemetry it works with.
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "logs"] }
# The exporter's clients, one per transport OTEL_EXPORTER_OTLP_PROTOCOL
# names: protobuf over HTTP on reqwest, and gRPC on tonic — what a
# platform's managed collector speaks (Container Apps' agent takes
# gRPC alone). reqwest here is 0.13 while object_store 0.13 (the one
# datafusion 55 pins) and oauth2 5 require 0.12, so
# the tree carries both. The way back to one: object_store 0.14
# (reqwest 0.13) reaching datafusion, then the login
# through a reqwest 0.13 client (oauth2-reqwest, alpha as of
# 0.1.0-alpha.3, or oauth2's own client trait). The SDK exports from
# its own thread, which is why the blocking HTTP client fits; the gRPC
# channel spawns its connection onto the runtime it is built in.
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "logs", "http-proto", "reqwest-blocking-client", "grpc-tonic"] }
# The bridge from `tracing` events to the SDK's log records.
opentelemetry-appender-tracing = "0.33"
# The request span on every door, and the `traceparent` a client sends
# becoming its parent. tower-http is in the tree through reqwest.
tower-http = { version = "0.7", features = ["trace"] }
opentelemetry-http = "0.33"
tracing-opentelemetry = "0.34"
